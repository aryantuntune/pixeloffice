name: Deploy

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build image, push, deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            djdiptayan/pixeloffice:latest
            djdiptayan/pixeloffice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/services/pixeloffice

            # Pull fresh image and force-recreate container
            sudo docker compose pull app
            sudo docker compose up -d --force-recreate app

            # Verify PixelOffice is healthy after redeploy
            for i in $(seq 1 15); do
              if curl -sf -o /dev/null http://localhost:2567/api/health; then
                echo "PixelOffice is up and healthy."
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "PixelOffice did not come up after redeploy" >&2
                sudo docker logs --tail 50 pixeloffice-app >&2
                exit 1
              fi
              sleep 2
            done

            sudo docker image prune -f
